    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Ships at Dawn",
      "url": "https://ships-at-dawn.com/",
      "email": "chris@ships-at-dawn.com",
      "image": "https://ships-at-dawn.com/og.png",
      "description": "Rapid prototyping as a service. From concept to deployed MVP in one day, live on a real URL.",
      "areaServed": "CH",
      "priceRange": "CHF 600 to CHF 3000",
      "knowsLanguage": ["en", "de"],
      "makesOffer": [
        {
          "@type": "Offer",
          "name": "Blitz",
          "description": "Half a day of focused building for small projects, deployed on a live URL.",
          "price": "600",
          "priceCurrency": "CHF"
        },
        {
          "@type": "Offer",
          "name": "Prototype Day",
          "description": "One full day from concept to deployed MVP, ready for real users.",
          "price": "1200",
          "priceCurrency": "CHF"
        },
        {
          "@type": "Offer",
          "name": "Three Day Sprint",
          "description": "Three days for bigger scope with one iteration round included.",
          "price": "3000",
          "priceCurrency": "CHF"
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What can realistically be built in one day?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A focused web app that proves your core idea: a landing page with real functionality, a marketplace flow, a booking tool, a dashboard, an AI powered feature. The scope is cut to what matters."
          }
        },
        {
          "@type": "Question",
          "name": "What do you need from me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your idea, 30 minutes for the kickoff call, and availability for quick questions during the day."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fixed prices: CHF 600 for a Blitz half day, CHF 1200 for a full prototype day, CHF 3000 for a three day sprint. Vereine and nonprofits get 20 percent off."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after day one?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The prototype is yours, including the code. If it works, we can book iteration days to extend it, or you take it to your own team. No lock in."
          }
        }
      ]
    }
